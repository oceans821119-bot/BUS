<style>
:root{
  --bg:#0a1410; --panel:#0d1a14; --line:#1c3327;
  --led:#ffb400; --green:#3ea25a; --green-dim:#1d3d27;
  --text:#e8f0ea; --sub:#7fa08c; --warn:#ff5a3c;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none;}
body{padding:calc(var(--st) + 12px) 16px calc(var(--sb) + 20px);display:flex;flex-direction:column;align-items:center;}
.wrap{width:100%;max-width:480px;}
.mono{font-family:'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums;}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.loc{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px;min-height:20px;}
.loc .pin{color:var(--green);}
.clock{font-size:13px;color:var(--sub);}

.stops{display:flex;gap:8px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;}
.stops::-webkit-scrollbar{display:none;}
.stop-tab{flex:1 0 auto;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);color:var(--sub);font-size:16px;font-weight:700;font-family:inherit;white-space:nowrap;}
.stop-tab.active{background:var(--green-dim);color:var(--green);border-color:var(--green);}
.stop-tab small{display:block;font-size:11px;font-weight:600;opacity:.8;margin-top:2px;}
.gps-tab{flex:0 0 auto;}

.board{background:radial-gradient(ellipse at top,#10241a 0%,#08120d 70%);border:2px solid var(--line);
  border-radius:18px;padding:18px 16px 14px;box-shadow:inset 0 0 40px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.4);}
.stop-name{font-size:20px;font-weight:800;}
.route-line{font-size:12px;color:var(--green);letter-spacing:.05em;margin:3px 0 12px;}

.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.chip{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--sub);font-size:13px;font-weight:700;font-family:inherit;}
.chip.on{color:#08120d;border-color:transparent;}

.cd-label{font-size:12px;color:var(--sub);letter-spacing:.1em;}
.next-dest{margin-top:6px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;min-height:24px;}
.countdown{font-weight:700;font-size:min(19vw,86px);line-height:1;color:var(--led);
  text-shadow:0 0 6px rgba(255,180,0,.55),0 0 22px rgba(255,180,0,.25);text-align:center;padding:12px 0 6px;}
.countdown.urgent{color:var(--warn);text-shadow:0 0 8px rgba(255,90,60,.7),0 0 26px rgba(255,90,60,.35);animation:pulse 1s infinite;}
.countdown.small{font-size:min(10vw,40px);padding:22px 0 14px;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.next-time{text-align:center;font-size:14px;color:var(--sub);}
.next-time b{color:var(--text);font-size:16px;}
.walk-note{text-align:center;font-size:13px;margin-top:6px;min-height:18px;}
.walk-note.ok{color:var(--green);} .walk-note.ng{color:var(--warn);}

.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:14px 0 8px;}
.up-title{font-size:11px;color:var(--sub);letter-spacing:.1em;margin-bottom:4px;}
.up-item{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #142219;}
.up-item:last-child{border-bottom:none;}
.up-item .t{font-size:16px;font-weight:600;min-width:62px;}
.up-item .d{flex:1;font-size:13px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.up-item .r{font-size:12px;color:var(--green);}
.up-item.miss{opacity:.4;}
.tag{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:800;color:#08120d;flex:0 0 auto;}

.controls{display:flex;gap:10px;margin-top:14px;}
.seg{flex:1;display:flex;background:var(--panel);border-radius:12px;padding:4px;border:1px solid var(--line);}
.seg button{flex:1;padding:10px 4px;border:none;background:transparent;color:var(--sub);font-size:14px;font-weight:700;border-radius:9px;font-family:inherit;}
.seg button.active{background:var(--green-dim);color:var(--green);}
.icon-btn{width:46px;height:46px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--sub);font-size:18px;font-family:inherit;}
.icon-btn:active{background:var(--green-dim);}

.realtime-btn{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:14px;
  text-decoration:none;background:var(--green-dim);color:var(--green);border:1px solid var(--green);font-size:16px;font-weight:800;}
.realtime-btn .dot{width:9px;height:9px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite;}
.footnote{font-size:11px;color:#4c6659;text-align:center;margin-top:14px;line-height:1.6;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:100;}
.modal-overlay.show{display:flex;}
.modal-sheet{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:20px 20px calc(20px + var(--sb));animation:slideup .25s ease-out;}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-sheet h3{margin:0 0 10px;font-size:17px;}
.modal-sheet p{margin:0 0 14px;font-size:14px;color:var(--sub);line-height:1.7;white-space:pre-wrap;}
.modal-sheet button{width:100%;padding:13px;border:none;border-radius:12px;background:var(--green-dim);color:var(--green);font-weight:700;font-size:16px;font-family:inherit;}
.toast{position:fixed;bottom:calc(24px + var(--sb));left:50%;transform:translateX(-50%);background:#12241c;color:var(--green);
  border:1px solid var(--line);padding:10px 18px;border-radius:10px;font-size:14px;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;}
.toast.show{opacity:1;}
</style>
</head>

<div class="wrap">
  <div class="topbar">
    <div class="loc" id="loc"><span class="pin">📍</span><span id="locText">現在地を確認中…</span></div>

    table:{

      holiday:{5:[30,48],6:[9,27,43,55],7:[7,17,28,37,46,57],8:[7,17,28,41,44,53],9:[3,12,20,30,39,52],10:[3,13,25,37,44,54],11:[3,14,23,35,45,54],12:[4,13,24,34,41,51],13:[0,10,22,30,42,50,59],14:[8,18,28,38,48,58],15:[7,14,22,32,40,51,58],16:[8,14,22,33,40,47,56],17:[3,12,20,30,40,48,56],18:[5,13,23,31,41,50,59],19:[8,19,30,40,58],20:[13,24,40,53],21:[8,25,43],22:[0,18,35]}

    table:{"weekday":{"5":["30エ","58エ"],"6":[8,19,"29エ","37ミ",47,55],"7":[2,"8エ",14,20,25,31,38,44,"51エ",57],"8":[2,7,12,18,24,"29エ","31オ","37エ",44,51],"9":[0,"7ナ","13エ","20●","28エ",36,"47エ",55],"10":["3ナ",12,"21●","30エ",38,"48エ",55],"11":["4ナ",13,"21エ","30●",37,"48エ",55],"12":[4,"12ナ",21,"30●","39エ",47,56],"13":["5エ","12オ",19,28,"38●","47エ",56],"14":["5ナ",12,"20●","27エ","34エ",40,47,"54ア"],"15":["1エ",8,"16エ","23●",30,"38エ","46ア",53],"16":[0,"7エ","13オ",20,"26●",33,"41ア","47エ","54ミ"],"17":[0,"6ナ",12,19,26,34,"42エ","49ア",55],"18":["2ナ",8,"15エ",22,29,"37エ",43,"51ア","58エ"],"19":[7,"16エ",26,34,"42エ","49ア",58],"20":["7エ",15,"25エ","36●",45,"55ア"],"21":["7エ","18エ",28,38,"48ア","58エ"],"22":[13,"28エ","44ア","59エ"],"23":[],"24":[]},"holiday":{"5":["43エ"],"6":[0,"19エ",38,54],"7":["7エ",17,28,"39エ","47オ","58エ"],"8":[8,19,"30●",39,"51エ"],"9":[3,"14ナ","23エ","33●",42,"53エ"],"10":["3エ",14,"26ナ",36,"47エ","57●"],"11":["7ナ",16,"28エ",36,47,57],"12":["7エ",15,25,"35●","45ナ",54],"13":["4エ",13,"23エ",33,"43ナ","53●"],"14":["2エ",11,21,"31エ",39,50],"15":["0エ","8オ","18●",25,"34エ",43,"53ア"],"16":[1,"10エ","18●",25,34,"44エ","53ア"],"17":[0,"10エ",18,"26ナ",34,"44エ","53ア"],"18":[0,"9ナ",17,26,"35エ","44ア","52エ"],"19":["1●","11エ","20ア",30,"43エ","56エ"],"20":[10,"24エ",37,51],"21":["5エ",18,"36エ",53],"22":[10,"28エ","48エ"],"23":[],"24":[]}}

];

// ===== 祝日(振替含む) =====
const HOLIDAYS = new Set([
  '2026-01-01','2026-01-12','2026-02-11','2026-02-23','2026-03-20','2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-05-06',
  '2026-07-20','2026-08-11','2026-09-21','2026-09-22','2026-09-23','2026-10-12','2026-11-03','2026-11-23',
  '2027-01-01','2027-01-11','2027-02-11','2027-02-23','2027-03-21','2027-03-22','2027-04-29','2027-05-03','2027-05-04','2027-05-05',
  '2027-07-19','2027-08-11','2027-09-20','2027-09-23','2027-10-11','2027-11-03','2027-11-23'
]);

// ===== 状態 =====
const LS = k => 'kwbus_'+k;
function lsGet(k,def){try{const v=localStorage.getItem(LS(k));return v===null?def:JSON.parse(v);}catch(e){return def;}}
function lsSet(k,v){try{localStorage.setItem(LS(k),JSON.stringify(v));}catch(e){}}

let dayMode = lsGet('mode','auto');
let stopMode = lsGet('stopMode','gps');         // 'gps' or stop id
let currentStopId = lsGet('lastStop', STOPS[0].id);
let filters = lsGet('filters', {});               // {stopId: [marks]}
let userPos = null;                               // {lat,lng,acc}
let gpsState = 'pending';                         // pending / ok / denied / unavailable

const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const isHoliday = d => d.getDay()===0 || d.getDay()===6 || HOLIDAYS.has(ymd(d));

function schedKeyFor(d){
  if(dayMode==='weekday') return 'weekday';
  if(dayMode==='holiday') return 'holiday';
  return isHoliday(d)?'holiday':'weekday';
}

function distM(a,b){
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat), dLng=toR(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
const walkMin = m => Math.max(1, Math.ceil(m*1.25/80));  // 道のり補正1.25・分速80m

function nearestStop(){
  if(!userPos) return null;
  let best=null;
  for(const s of STOPS){
    const d=distM(userPos,s);
    if(!best||d<best.d) best={s,d};
  }
  return best;
}

function activeStop(){
  if(stopMode!=='gps') return STOPS.find(s=>s.id===stopMode)||STOPS[0];
  const n=nearestStop();
  if(n){ currentStopId=n.s.id; lsSet('lastStop',currentStopId); }
  return STOPS.find(s=>s.id===currentStopId)||STOPS[0];
}

function parseEntry(e){
  if(typeof e==='number') return {m:e, mark:''};
  const m=parseInt(e,10); return {m, mark:e.replace(/^\d+/,'')};
}

function departures(stop, now){
  const list=[];
  const sel = stop.useMarks ? (filters[stop.id]||[]) : [];
  for(let dayOff=0; dayOff<2 && list.length<8; dayOff++){
    const base=new Date(now.getFullYear(),now.getMonth(),now.getDate()+dayOff);
    const tbl=stop.table[schedKeyFor(base)];
    for(let h=0;h<=24;h++){
      for(const e of (tbl[h]||[])){
        const {m,mark}=parseEntry(e);
        if(sel.length && !sel.includes(mark)) continue;
        const dt=new Date(base.getFullYear(),base.getMonth(),base.getDate(),h,m,0);
        if(dt>now) list.push({dt,mark,nextDay:dayOff>0});
      }
    }
  }
  return list;
}

function destOf(stop, mark){ return stop.useMarks ? DEST[mark] : stop.fixedDest; }
function tagHTML(dest){ return `<span class="tag" style="background:${dest.color}">${dest.route||''}${dest.route?' ':''}${dest.short}</span>`; }

function fmtCD(sec){
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return h>0?`${h}:${pad(m)}:${pad(s)}`:`${pad(m)}:${pad(s)}`;
}
function fmtRel(sec){
  const m=Math.floor(sec/60);
  if(m<1) return 'まもなく';
  if(m<60) return `あと${m}分`;
  return `あと${Math.floor(m/60)}時間${m%60}分`;
}

// ===== 描画 =====
function renderStops(){
  const el=document.getElementById('stops');
  const st=activeStop();
  let html=`<button class="stop-tab gps-tab ${stopMode==='gps'?'active':''}" data-id="gps">📍 自動<small>近いバス停</small></button>`;
  for(const s of STOPS){
    const isActive = stopMode===s.id;
    const auto = stopMode==='gps' && st.id===s.id;
    html+=`<button class="stop-tab ${isActive?'active':''}" data-id="${s.id}" style="${auto?'border-color:var(--green);color:var(--text)':''}">${s.name}<small>${s.pole}・${s.dir}</small></button>`;
  }
  el.innerHTML=html;
}

function renderFilters(stop){
  const el=document.getElementById('filters');
  if(!stop.useMarks){ el.innerHTML=''; el.style.display='none'; return; }
  el.style.display='flex';
  const sel=filters[stop.id]||[];
  // 時刻表に存在する行先のみ表示
  const present=new Set();
  for(const k of ['weekday','holiday']) for(const h in stop.table[k]) for(const e of stop.table[k][h]) present.add(parseEntry(e).mark);
  let html=`<button class="chip ${sel.length===0?'on':''}" data-mark="__all" style="${sel.length===0?'background:var(--green)':''}">すべて</button>`;
  for(const mk of DEST_ORDER){
    if(!present.has(mk)) continue;
    const d=DEST[mk], on=sel.includes(mk);
    html+=`<button class="chip ${on?'on':''}" data-mark="${mk}" style="${on?'background:'+d.color:''}">${d.short}</button>`;
  }
  el.innerHTML=html;
}

function renderLoc(){
  const t=document.getElementById('locText');
  if(gpsState==='pending'){ t.textContent='現在地を確認中…'; return; }
  if(gpsState==='tap'){ t.textContent='◎ボタンで現在地を取得'; return; }
  if(gpsState!=='ok'){ t.textContent= gpsState==='denied'?'位置情報オフ(手動で選択)':'現在地を取得できません'; return; }
  const st=activeStop();
  const d=distM(userPos,st);
  t.textContent = d<1500 ? `${st.name}まで約${Math.round(d/10)*10}m・徒歩${walkMin(d)}分` : `${st.name}まで約${(d/1000).toFixed(1)}km`;
}

function render(){
  const now=new Date();
  document.getElementById('clock').textContent=`${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const stop=activeStop();
  renderLoc();

  document.getElementById('stopName').textContent=`${stop.name} ${stop.pole}`;
  document.getElementById('routeLine').textContent=stop.routes;
  document.getElementById('footnote').textContent=stop.note;
  const rt=document.getElementById('realtimeBtn');
  rt.href=stop.realtime;
  document.getElementById('realtimeText').textContent = stop.realtime.includes('signpole') ? 'リアルタイム接近情報(市バスナビ)' : '市バスナビで接近情報を検索';

  const key=schedKeyFor(now);
  const label = key==='holiday'?'土休日ダイヤ':'平日ダイヤ';
  document.getElementById('cdLabel').textContent = `${label}${dayMode==='auto'?'(自動)':''} ・ 次のバスまで`;

  const deps=departures(stop,now);
  const cd=document.getElementById('countdown'), nt=document.getElementById('nextTime'),
        nd=document.getElementById('nextDest'), wn=document.getElementById('walkNote'), up=document.getElementById('upcoming');

  if(!deps.length){
    cd.textContent='運行なし'; cd.className='countdown mono small';
    nt.innerHTML='&nbsp;'; nd.innerHTML=''; wn.textContent=''; up.innerHTML='';
    return;
  }

  // 徒歩時間(GPS取得済みかつ1.5km以内)
  let walk=null;
  if(gpsState==='ok'){ const d=distM(userPos,stop); if(d<1500) walk=walkMin(d); }

  const n=deps[0];
  const sec=Math.max(0,Math.round((n.dt-now)/1000));
  const longWait = sec>=3*3600;
  cd.textContent=fmtCD(sec);
  cd.className='countdown mono'+(sec<=120?' urgent':'')+(longWait?' small':'');
  nd.innerHTML=tagHTML(destOf(stop,n.mark))+`<span style="font-size:14px;color:var(--sub);font-weight:600">${destOf(stop,n.mark).name}</span>`;
  nt.innerHTML=`<b>${pad(n.dt.getHours())}:${pad(n.dt.getMinutes())}</b> 発${n.nextDay?'(翌日)':''}`;

  if(walk!==null && walk>1){
    const firstOk=deps.find(x=>(x.dt-now)/60000>=walk);
    if((n.dt-now)/60000>=walk){
      const leave=Math.floor((n.dt-now)/60000-walk);
      wn.className='walk-note ok'; wn.textContent = leave<=0?`徒歩${walk}分 ・ 今すぐ出発で間に合います`:`徒歩${walk}分 ・ あと${leave}分以内に出発`;
    }else if(firstOk){
      wn.className='walk-note ng'; wn.textContent=`徒歩${walk}分のため間に合いません → 次は ${pad(firstOk.dt.getHours())}:${pad(firstOk.dt.getMinutes())} 発`;
    }else{ wn.textContent=''; }
  }else{ wn.textContent=''; }

  up.innerHTML=deps.slice(1,7).map(x=>{
    const s=Math.round((x.dt-now)/1000);
    const miss = walk!==null && walk>1 && s/60<walk;
    const dest=destOf(stop,x.mark);
    return `<div class="up-item ${miss?'miss':''}"><span class="t mono">${pad(x.dt.getHours())}:${pad(x.dt.getMinutes())}${x.nextDay?'<span style="font-size:10px">翌</span>':''}</span><span class="d">${tagHTML(dest)}</span><span class="r mono">${fmtRel(s)}</span></div>`;
  }).join('');
}

function renderAll(){ renderStops(); renderFilters(activeStop()); renderDaySeg(); render(); }
function renderDaySeg(){ document.querySelectorAll('#daySeg button').forEach(b=>b.classList.toggle('active',b.dataset.mode===dayMode)); }

// ===== 位置情報 =====
// 前回の位置を保存しておき、30分以内なら再取得しない(=確認ダイアログを出さない)
const POS_TTL = 30*60*1000;
const cachedPos = lsGet('pos', null);
if(cachedPos && Date.now()-cachedPos.t < POS_TTL){ userPos=cachedPos; gpsState='ok'; }

// すでに許可済みかどうかを確認(許可済みなら自動取得してもダイアログは出ない)
async function permState(){
  try{
    if(navigator.permissions && navigator.permissions.query){
      const r = await navigator.permissions.query({name:'geolocation'});
      return r.state; // 'granted' | 'prompt' | 'denied'
    }
  }catch(e){}
  return 'unknown';
}

// 自動取得: 許可済み かつ 保存位置が古い時だけ
async function autoGPS(){
  if(stopMode!=='gps') return;
  if(userPos && userPos.t && Date.now()-userPos.t < POS_TTL) return;
  const st = await permState();
  if(st==='granted') requestGPS(false);
  else if(!userPos){ gpsState = st==='denied' ? 'denied' : 'tap'; renderAll(); }
}

function requestGPS(manual){
  if(!('geolocation' in navigator)){ gpsState='unavailable'; renderAll(); return; }
  if(manual){ gpsState='pending'; renderLoc(); }
  navigator.geolocation.getCurrentPosition(p=>{
    userPos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};
    lsSet('pos',userPos);
    gpsState='ok'; renderAll();
    if(manual) toast(`現在地を更新しました(精度 約${Math.round(p.coords.accuracy)}m)`);
  },err=>{
    gpsState = err.code===1?'denied':'unavailable';
    renderAll();
    if(manual){
      if(err.code===1) showModal('位置情報がオフです','設定アプリ →「プライバシーとセキュリティ」→「位置情報サービス」で、Safari(またはこのアプリ)の位置情報を許可してください。\n\n許可しない場合も、上のバス停ボタンから手動で切り替えできます。');
      else showModal('現在地を取得できません','電波状況の良い場所で ◎ ボタンをもう一度押してください。');
    }
  },{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}

// ===== イベント =====
document.getElementById('stops').addEventListener('click',e=>{
  const b=e.target.closest('.stop-tab'); if(!b) return;
  stopMode=b.dataset.id; lsSet('stopMode',stopMode);
  if(stopMode==='gps') autoGPS();
  renderAll();
});
document.getElementById('filters').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  const st=activeStop(); let sel=filters[st.id]||[];
  const mk=b.dataset.mark;
  if(mk==='__all') sel=[];
  else sel = sel.includes(mk) ? sel.filter(x=>x!==mk) : [...sel,mk];
  filters[st.id]=sel; lsSet('filters',filters);
  renderFilters(st); render();
});
document.getElementById('daySeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  dayMode=b.dataset.mode; lsSet('mode',dayMode); renderDaySeg(); render();
});
document.getElementById('gpsBtn').addEventListener('click',()=>{
  if(stopMode!=='gps'){ stopMode='gps'; lsSet('stopMode','gps'); }
  requestGPS(true);
});
document.getElementById('shareBtn').addEventListener('click',()=>{
  const now=new Date(), st=activeStop(), deps=departures(st,now).slice(0,3);
  let text=`【${st.name} ${st.pole} 発車案内】\n`;
  if(!deps.length) text+='本日の運行は終了しました。';
  else text+=deps.map(x=>`${pad(x.dt.getHours())}:${pad(x.dt.getMinutes())} ${destOf(st,x.mark).name}`).join('\n');
  location.href='https://line.me/R/share?text='+encodeURIComponent(text);
});

function showModal(t,b){document.getElementById('mTitle').textContent=t;document.getElementById('mBody').textContent=b;document.getElementById('modal').classList.add('show');}
document.getElementById('mClose').onclick=()=>document.getElementById('modal').classList.remove('show');
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show');};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ autoGPS(); render(); } });

renderAll();
autoGPS();
setInterval(render,1000);
</script>
